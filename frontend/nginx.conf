# Rate limit for auth endpoints (login, register, forgot/reset password) to avg 5 reqs / minute
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

# Cap concurrent connections per client IP to limit slowloris-style connection
# exhaustion. Generous enough not to affect users behind a shared NAT.
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Don't advertise the nginx version in responses or error pages
server_tokens off;

server {
    # allow certbot to renew SSL certificates using port 80
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name mondey.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # forward anything else to https
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # redirect www.mondey.de to mondey.de, on both http and https
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mondey.de;
    ssl_certificate      /mondey_ssl_cert.pem;
    ssl_certificate_key  /mondey_ssl_key.pem;

    return 301 https://mondey.de$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mondey.de;
    ssl_certificate      /mondey_ssl_cert.pem;
    ssl_certificate_key  /mondey_ssl_key.pem;

    # Maximum file upload size
    client_max_body_size 20M;

    limit_conn addr 50;

    # Improve HTTPS performance with session resumption
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # Session tickets weaken forward secrecy, the session cache above is enough
    ssl_session_tickets off;

    # Forward-secret AEAD ciphers only for TLS 1.2 (TLS 1.3 picks its own ciphersuites and ignores ssl_ciphers)
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    # Security headers. All use `always` so they are also sent on error responses

    # ref: https://developer.mozilla.org/en-US/docs/Security/HTTP_Strict_Transport_Security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ref: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
    add_header X-Frame-Options DENY always;

    # ref: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
    add_header X-Content-Type-Options nosniff always;

    # Password reset and verification tokens are part of the URL path, so don't
    # leak the path to third parties in the Referer header
    # ref: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ref: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Proxy settings shared by all /api/ locations below.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/index.html /index.html;
    }

    location /api/auth/ {
        # rate limiting: allow bursts of up to 10 requests served immediately
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:80;
    }

    # These admin/researcher-only endpoints do a lot of work per request and can
    # take much longer than the default 60s proxy_read_timeout to complete.
    location ~ ^/api/(admin/(update-stats|research)|research/data)/ {
        proxy_pass http://backend:80;
        proxy_read_timeout 600;
    }

    location /api/ {
        proxy_pass http://backend:80;
    }
}
