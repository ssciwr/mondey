name: codegen
on:
  pull_request:
    branches:
      - main

jobs:
  codegen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
        if: github.event.pull_request.head.repo.full_name == github.repository || startsWith(github.event.pull_request.head.ref, 'dependabot/')
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.MONDEY_FORMAT_BOT_PAT }}
      - uses: actions/checkout@v7
        if: github.event.pull_request.head.repo.full_name != github.repository && !startsWith(github.event.pull_request.head.ref, 'dependabot/')
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: "Export openapi.json from fastapi app"
        run: |
            cd ../mondey_backend
            uv run --locked --no-dev mondey-export-openapi-json
      - run: pnpm install
      - name: "Generate SvelteKit tsconfig"
        run: pnpm exec svelte-kit sync
      - name: "Generate frontend fetch API client code"
        run: pnpm openapi-ts
      - uses: EndBug/add-and-commit@v11
        with:
          add: "*"
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "update openapi.json & openapi-ts client"
