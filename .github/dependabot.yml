version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    groups:
      all:
        applies-to: version-updates
        patterns:
          - '*'

  - package-ecosystem: 'uv'
    directory: '/mondey_backend'
    schedule:
      interval: 'monthly'
    groups:
      all:
        applies-to: version-updates
        patterns:
          - '*'
